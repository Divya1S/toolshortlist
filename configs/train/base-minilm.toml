name = "base-minilm"
description = "Ablation: all-MiniLM-L6-v2 (22M) as the base model; mean pooling, no query prefix."

[model]
base = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
pooling = "mean"
query_template = "{query}"
eval_max_length = 256

[data]
text_mode = "full"
hard_negatives = true

# Fixed before any run; nothing here is tuned on test data.
[training]
batch_size = 64
epochs = 1
learning_rate = 2e-5
warmup = 0.1
temperature = 0.05
query_max_length = 128
doc_max_length = 256
validate_every = 500
